[project]
name = "tanit-scenario-flywheel"
version = "0.1.0"
description = "Tanit Scenario Flywheel: text/video/incident/sensor -> verified OpenSCENARIO+OpenDRIVE -> Cosmos-rendered multi-sensor data -> closed loop"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12",
    "numpy>=2.3",
    "scipy>=1.16",
    "lxml>=5.3",
    "shapely>=2.1",
    "scenariogeneration>=0.16.7",
    "opencv-python-headless>=4.12",
    "imageio[ffmpeg]>=2.37",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "openai>=2.0",
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "typer>=0.20",
    "rich>=14.0",
    "jsonschema>=4.25",
    "matplotlib>=3.10",
 "xmlschema>=3.4",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "ruff>=0.14"]

[project.scripts]
tsf = "tsf.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsf"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
